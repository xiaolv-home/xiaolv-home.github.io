<div id="cmt" class="cmt-card" hidden></div>
<div class="bar"><b>堂食收入链路 · 脱敏复刻</b><span class="tip">点带 ⓘ 的形状看注释 · 滚轮缩放 · 拖动平移</span><span class="extra"><button id="zoom-out" aria-label="缩小画布">−</button><button id="zoom-in" aria-label="放大画布">＋</button></span><span id="pct">100%</span><button id="fit">适应窗口</button><button id="one">原尺寸</button><button id="flow-toggle" aria-pressed="false">暂停流动</button></div>
<script>
(() => {
  const stage = document.getElementById("stage"), board = document.getElementById("board"), pct = document.getElementById("pct");
  const card = document.getElementById("cmt");
  const W = +board.dataset.w, H = +board.dataset.h;
  let s = 1, x = 0, y = 0;
  // 注释卡片:点(没拖动)带注释的形状弹出来,再点一下或点别处收起;平移缩放时跟着形状走
  let shown = null;
  const placeCard = () => {
    if (!shown) return;
    const r = shown.getBoundingClientRect(), w = card.offsetWidth, h = card.offsetHeight;
    let top = r.bottom + 10;
    if (top + h > innerHeight - 70) top = Math.max(8, r.top - h - 10);
    card.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
    card.style.top = top + "px";
  };
  const showCard = (g) => {
    if (shown) shown.classList.remove("on");
    shown = g;
    if (g) g.classList.add("on");
    card.hidden = !g;
    if (g) { card.textContent = g.dataset.cmt; placeCard(); }
  };
  const apply = () => {
    board.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
    pct.textContent = Math.round(s * 100) + "%";
    placeCard();
  };
  const center = (scale) => { s = scale; x = (stage.clientWidth - W * s) / 2; y = (stage.clientHeight - H * s) / 2; apply(); };
  const fitScale = () => Math.min((stage.clientWidth - 48) / W, (stage.clientHeight - 48) / H);
  const zoomAt = (k, cx, cy) => { const n = Math.min(8, Math.max(0.1, s * k)); x = cx - (cx - x) * (n / s); y = cy - (cy - y) * (n / s); s = n; apply(); };
  document.getElementById("zoom-in").onclick=()=>zoomAt(1.3,stage.clientWidth/2,stage.clientHeight/2);
document.getElementById("zoom-out").onclick=()=>zoomAt(1/1.3,stage.clientWidth/2,stage.clientHeight/2);
document.getElementById("fit").onclick = () => center(fitScale());
  document.getElementById("one").onclick = () => center(1);
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  const pts = new Map();
  let last = null, down = null;
  stage.addEventListener("pointerdown", (e) => {
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    last = null;
    down = pts.size === 1 ? [e.clientX, e.clientY] : null;
    stage.classList.add("grab");
  });
  stage.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { x += e.clientX - prev[0]; y += e.clientY - prev[1]; apply(); return; }
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = stage.getBoundingClientRect();
    if (last) zoomAt(d / last, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    last = d;
  });
  const up = (e) => {
    // 按下到松开几乎没动 = 点了一下:看点中的是不是带注释的形状
    if (down && pts.size === 1 && Math.hypot(e.clientX - down[0], e.clientY - down[1]) <= 4) {
      const hit = document.elementsFromPoint(e.clientX, e.clientY).find((el) => el.closest && el.closest("g.cmt"));
      const g = hit ? hit.closest("g.cmt") : null;
      showCard(g === shown ? null : g);
    }
    pts.delete(e.pointerId);
    last = null;
    down = null;
    if (!pts.size) stage.classList.remove("grab");
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", (e) => { down = null; up(e); });
  addEventListener("resize", () => center(Math.min(1, fitScale())));
  center(Math.min(1, fitScale()));
const vb=document.querySelector('svg').viewBox.baseVal;
const focusRegion=(x0,y0,w,h)=>{s=Math.min((stage.clientWidth-36)/w,(stage.clientHeight-36)/h);x=(stage.clientWidth-w*s)/2-(x0-vb.x)*s;y=(stage.clientHeight-h*s)/2-(y0-vb.y)*s;showCard(null);apply()};
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-region]').forEach(q=>q.setAttribute('aria-pressed',String(b===q)));if(b.dataset.region==='all')center(fitScale());if(b.dataset.region==='source')focusRegion(-440,-1648,2241,1100);if(b.dataset.region==='metrics')focusRegion(0,-500,1420,1160)});
document.querySelectorAll('g.cmt').forEach(g=>{g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',g.querySelector('text')?.textContent+'：查看说明');g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showCard(g===shown?null:g)}if(e.key==='Escape')showCard(null)});});
stage.setAttribute('aria-label','堂食收入链路画布');
let flowPaused=matchMedia('(prefers-reduced-motion:reduce)').matches;const svg=document.querySelector('svg');const flowButton=document.getElementById('flow-toggle');function setFlow(){if(flowPaused)svg.pauseAnimations();else svg.unpauseAnimations();flowButton.textContent=flowPaused?'开启动效':'暂停流动';flowButton.setAttribute('aria-pressed',String(flowPaused))}setFlow();flowButton.onclick=()=>{flowPaused=!flowPaused;setFlow()};
addEventListener('message',e=>{if(e.origin===location.origin&&e.source===parent&&e.data?.type==='portfolio:motion'){flowPaused=e.data.paused;setFlow()}});
addEventListener('keydown',e=>{if(e.key==='Escape'){showCard(null);parent.postMessage({type:'canvas:escape'},location.origin)}});
})();
</script>
